name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ca-central-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: 1.16.5

jobs:
  checks:
    name: Format, validate, lint, scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff terraform

      - name: Validate
        run: |
          for dir in terraform/bootstrap terraform/envs/dev; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          docker run --rm -e GITHUB_TOKEN -v "$PWD/terraform:/data" -w /data --entrypoint sh
          ghcr.io/terraform-linters/tflint:v0.64.0@sha256:1c595f42d794c32c45a6ea8b58655fd66433d4ca3b1bc631c574a48d120bd19f
          -c 'tflint --init && tflint --recursive --config /data/.tflint.hcl --format compact'

      - name: Checkov
        run: >-
          docker run --rm -v "$PWD/terraform:/tf:ro"
          bridgecrew/checkov:3.3.19@sha256:d3e96adafdb315ca82e792ca8708c01adae85292800fb064c8b309b3d0cb7b80
          -d /tf --framework terraform --quiet --compact --download-external-modules false

  plan:
    name: Plan (dev)
    needs: checks
    # Pull requests from forks get no AWS access.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/envs/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::710590320983:role/medibook-dev-github-tf-plan
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init

      - name: Plan
        run: |
          set +e
          terraform plan -lock-timeout=5m -no-color -detailed-exitcode -out=dev.tfplan > plan.txt
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi
          {
            echo "## Terraform plan (dev)"
            echo
            if [ "$code" -eq 2 ]; then
              echo '```'
              terraform show -no-color dev.tfplan | tail -n 200
              echo '```'
            else
              echo "No changes. The infrastructure matches the code."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
