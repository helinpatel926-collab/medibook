server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;

    location /api/auth/ {
        proxy_pass http://auth-service:8000;
    }

    location /api/public/doctors {
        proxy_pass http://doctor-service:8000;
    }

    location /api/public/departments {
        proxy_pass http://doctor-service:8000;
    }

    location /api/public/slots {
        proxy_pass http://doctor-service:8000;
    }

    location /api/public/ {
        proxy_pass http://appointment-service:8000;
    }

    location /api/staff/patients {
        proxy_pass http://patient-service:8000;
    }

    location /api/staff/ {
        proxy_pass http://appointment-service:8000;
    }

    location /internal/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
