<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediBook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="banner">
    <h1>MediBook</h1>
    <p>Clinic appointment booking</p>
  </header>

  <main>
    <section class="card">
      <h2>Add patient</h2>
      <form id="patient-form">
        <label>Full name
          <input name="full_name" required maxlength="100" autocomplete="off">
        </label>
        <label>Email
          <input name="email" type="email" maxlength="120" autocomplete="off">
        </label>
        <label>Phone
          <input name="phone" maxlength="30" autocomplete="off">
        </label>
        <label>Date of birth
          <input name="date_of_birth" type="date">
        </label>
        <button type="submit">Add patient</button>
      </form>
    </section>

    <section class="card">
      <h2>Book appointment</h2>
      <form id="appointment-form">
        <label>Patient
          <select name="patient_id" required>
            <option value="">Add a patient first</option>
          </select>
        </label>
        <label>Doctor
          <select name="doctor" required>
            <option>Dr. Emily Carter (Family Medicine)</option>
            <option>Dr. Raj Mehta (Cardiology)</option>
            <option>Dr. Sofia Alvarez (Dermatology)</option>
            <option>Dr. Daniel Kim (Pediatrics)</option>
          </select>
        </label>
        <label>Date and time
          <input name="appointment_time" type="datetime-local" required>
        </label>
        <label>Reason
          <input name="reason" maxlength="300" autocomplete="off">
        </label>
        <button type="submit">Book appointment</button>
      </form>
    </section>

    <section class="card wide">
      <h2>Appointments</h2>
      <table>
        <thead>
          <tr><th>When</th><th>Patient</th><th>Doctor</th><th>Reason</th><th>Status</th></tr>
        </thead>
        <tbody id="appointments"></tbody>
      </table>
    </section>

    <section class="card wide">
      <h2>Patients</h2>
      <table>
        <thead>
          <tr><th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Date of birth</th></tr>
        </thead>
        <tbody id="patients"></tbody>
      </table>
    </section>
  </main>

  <p id="message" role="status" hidden></p>

  <footer>
    MediBook · API <span id="version">…</span> ·
    <span id="status" class="status">checking…</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
