name: medibook

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medibook
      POSTGRES_USER: medibook
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibook -d medibook"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./app/api
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: medibook
      DB_USER: medibook
      DB_PASSWORD: ${DB_PASSWORD}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./app/frontend
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

  # Test profile: ephemeral database for the test suite.
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: medibook_test
      POSTGRES_USER: medibook
      POSTGRES_PASSWORD: test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibook -d medibook_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  api-tests:
    build:
      context: ./app/api
      target: test
    profiles: ["test"]
    environment:
      DB_HOST: db-test
      DB_NAME: medibook_test
      DB_USER: medibook
      DB_PASSWORD: test-only
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  db-data:
