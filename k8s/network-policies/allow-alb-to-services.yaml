apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-services
  namespace: medibook
  labels:
    app.kubernetes.io/part-of: medibook
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - auth-service
          - doctor-service
          - patient-service
          - appointment-service
  policyTypes:
    - Ingress
  ingress:
    # Public subnets that hold the ALB (traffic and health checks to IP targets).
    - from:
        - ipBlock:
            cidr: 10.0.0.0/24
        - ipBlock:
            cidr: 10.0.1.0/24
      ports:
        - protocol: TCP
          port: 8000
