apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doctor-service
  namespace: medibook
  labels:
    app.kubernetes.io/name: doctor-service
    app.kubernetes.io/part-of: medibook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: doctor-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
