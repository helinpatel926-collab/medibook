apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: medibook
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: medibook
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
