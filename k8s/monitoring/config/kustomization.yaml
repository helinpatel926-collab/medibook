apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - servicemonitors.yaml
# The Grafana dashboard sidecar loads every ConfigMap labelled grafana_dashboard: "1".
configMapGenerator:
  - name: medibook-dashboards
    files:
      - dashboards/medibook-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: medibook
