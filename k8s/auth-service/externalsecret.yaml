apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-env
  namespace: medibook
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: medibook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: auth-service-env
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: medibook/dev/jwt
        property: JWT_SECRET
    - secretKey: STAFF_EMAIL
      remoteRef:
        key: medibook/dev/staff-login
        property: STAFF_EMAIL
    - secretKey: STAFF_PASSWORD
      remoteRef:
        key: medibook/dev/staff-login
        property: STAFF_PASSWORD
    - secretKey: STAFF_NAME
      remoteRef:
        key: medibook/dev/staff-login
        property: STAFF_NAME
    - secretKey: STAFF_ROLE
      remoteRef:
        key: medibook/dev/staff-login
        property: STAFF_ROLE
