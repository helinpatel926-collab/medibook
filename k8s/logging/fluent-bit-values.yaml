# Values for fluent-bit 0.58.2 (fluent), deployed by k8s/argocd/apps/logging.yaml.
# Ships MediBook container logs to CloudWatch Logs, one log stream per pod.

kind: DaemonSet

serviceAccount:
  create: true
  name: fluent-bit
  annotations:
    # IRSA role from terraform/envs/dev/iam.tf; it trusts only logging/fluent-bit.
    eks.amazonaws.com/role-arn: arn:aws:iam::710590320983:role/medibook-dev-fluent-bit

testFramework:
  enabled: false

resources:
  requests:
    cpu: 20m
    memory: 48Mi
  limits:
    memory: 128Mi

# Run on every node, whatever its taints.
tolerations:
  - operator: Exists

# containerd nodes only need /var/log. The state directory keeps tail offsets across restarts.
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: state
    hostPath:
      path: /var/fluent-bit/state
      type: DirectoryOrCreate

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: state
    mountPath: /var/fluent-bit/state

config:
  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_medibook_*.log
        multiline.parser  cri
        DB                /var/fluent-bit/state/flb_medibook.db
        DB.locking        true
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off

  # Instance metadata is blocked for pods, so the region is set explicitly.
  # The IAM role cannot create log groups; the group is managed by Terraform.
  # log_stream_prefix is only used if the pod name cannot be resolved.
  outputs: |
    [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.*
        region              ca-central-1
        log_group_name      /medibook/dev/services
        log_stream_template $kubernetes['pod_name']
        log_stream_prefix   unknown-
        auto_create_group   Off
        Retry_Limit         5
