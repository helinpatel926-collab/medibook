apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: medibook
  labels:
    app.kubernetes.io/name: appointment-service
    app.kubernetes.io/part-of: medibook
spec:
  # The HorizontalPodAutoscaler owns the replica count (minimum 2).
  selector:
    matchLabels:
      app.kubernetes.io/name: appointment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appointment-service
        app.kubernetes.io/part-of: medibook
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: appointment-service
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: appointment-service
          image: medibook-appointment-service
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: appointment-service-env
          env:
            - name: DB_SSLMODE
              value: require
            - name: SEED_ENABLED
              value: "false"
            - name: DOCTOR_SERVICE_URL
              value: http://doctor-service:8000
            - name: PATIENT_SERVICE_URL
              value: http://patient-service:8000
            - name: CLINIC_TZ
              value: America/Toronto
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            # Keeps serving while the ALB deregisters the pod IP.
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
