apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: appointment-service-env
  namespace: medibook
  labels:
    app.kubernetes.io/name: appointment-service
    app.kubernetes.io/part-of: medibook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: appointment-service-env
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: medibook/dev/appointment-service/db
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: medibook/dev/appointment-service/db
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: medibook/dev/appointment-service/db
        property: database
    - secretKey: DB_USER
      remoteRef:
        key: medibook/dev/appointment-service/db
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: medibook/dev/appointment-service/db
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: medibook/dev/jwt
        property: JWT_SECRET
