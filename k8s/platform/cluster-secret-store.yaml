apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      # Set explicitly because pods cannot reach the instance metadata service.
      region: ca-central-1
      # No auth block: the controller uses its own IRSA role (medibook-dev-external-secrets).
