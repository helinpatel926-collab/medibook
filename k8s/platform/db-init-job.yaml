apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: medibook
  labels:
    app.kubernetes.io/name: db-init
    app.kubernetes.io/part-of: medibook
  annotations:
    # Runs on every sync of this app, after the db-init ExternalSecret is ready.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-init
        app.kubernetes.io/part-of: medibook
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # The postgres user of the Alpine image.
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-init
          image: postgres:16.15-alpine3.24
          command: ["/bin/sh", "/scripts/db-init.sh"]
          envFrom:
            - secretRef:
                name: db-init
          env:
            - name: PGDATABASE
              value: postgres
            - name: PGSSLMODE
              value: require
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: PGAPPNAME
              value: medibook-db-init
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: db-init
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
