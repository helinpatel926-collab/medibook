apiVersion: v1
kind: Namespace
metadata:
  name: medibook
  labels:
    app.kubernetes.io/part-of: medibook
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    # The load balancer controller marks a pod ready only after the ALB target is healthy.
    elbv2.k8s.aws/pod-readiness-gate-inject: enabled
  annotations:
    # Deleting the namespace would delete every service with it, so Argo CD never removes it.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
