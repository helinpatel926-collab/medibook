apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-init
  namespace: medibook
  labels:
    app.kubernetes.io/name: db-init
    app.kubernetes.io/part-of: medibook
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: db-init
    creationPolicy: Owner
  data:
    - secretKey: PGHOST
      remoteRef:
        key: medibook/dev/doctor-service/db
        property: host
    - secretKey: PGPORT
      remoteRef:
        key: medibook/dev/doctor-service/db
        property: port
    # Admin login managed by RDS. The name changes if the instance is replaced.
    - secretKey: PGUSER
      remoteRef:
        key: "rds!db-ad565031-5a6a-4e7c-85c1-f42a1b8f89a0"
        property: username
    - secretKey: PGPASSWORD
      remoteRef:
        key: "rds!db-ad565031-5a6a-4e7c-85c1-f42a1b8f89a0"
        property: password
    - secretKey: DOCTOR_DB_PASSWORD
      remoteRef:
        key: medibook/dev/doctor-service/db
        property: password
    - secretKey: PATIENT_DB_PASSWORD
      remoteRef:
        key: medibook/dev/patient-service/db
        property: password
    - secretKey: APPOINTMENT_DB_PASSWORD
      remoteRef:
        key: medibook/dev/appointment-service/db
        property: password
