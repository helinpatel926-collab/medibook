apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - storageclass.yaml
  - cluster-secret-store.yaml
  - db-init-external-secret.yaml
  - db-init-job.yaml

configMapGenerator:
  - name: db-init
    namespace: medibook
    files:
      - db-init.sh
      - db-init.sql
    options:
      labels:
        app.kubernetes.io/name: db-init
        app.kubernetes.io/part-of: medibook
